name: Refresh ISM data

on:
  schedule:
    - cron: '0 6,12,18 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Pull fresh data from Metabase
        run: python scripts/fetch_data.py
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          CARD_ISM_BASE: ${{ secrets.CARD_ISM_BASE }}
          CARD_ISM_SUBSCRIPTIONS: ${{ secrets.CARD_ISM_SUBSCRIPTIONS }}
          CARD_ISM_TASKS: ${{ secrets.CARD_ISM_TASKS }}
          CARD_ISM_TOUCHES: ${{ secrets.CARD_ISM_TOUCHES }}
          CARD_ISM_REVENUE: ${{ secrets.CARD_ISM_REVENUE }}
          CARD_SUBS_INSTALLMENTS: ${{ secrets.CARD_SUBS_INSTALLMENTS }}

      - name: Commit updated data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add public/data/*.json
          git diff --staged --quiet || git commit -m "Refresh ISM data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
